plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionFile = rootProject.file('VERSION')
def rev = versionFile.exists() ? versionFile.text.trim() : '1'
def revInt = rev.isInteger() ? rev.toInteger() : 1

android {
    namespace 'com.example.ncphonetrack'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ncphonetrack"
        minSdk 24
        targetSdk 34
        versionCode revInt
        versionName rev
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'debugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    implementation 'org.json:json:20231013'
}
