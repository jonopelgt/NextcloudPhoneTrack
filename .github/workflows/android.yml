name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-rev1
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to distro
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p distro/rev-1
          cp app/build/outputs/apk/debug/*.apk distro/rev-1/NextcloudPhoneTrack-rev1-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distro/rev-1/NextcloudPhoneTrack-rev1-debug.apk
          git diff --staged --quiet || git commit -m "ci: publish Rev 1 debug APK to distro"
          git push
