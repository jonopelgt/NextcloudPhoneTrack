name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Decode keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Get revision
        id: rev
        run: echo "REV=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-rev${{ steps.rev.outputs.REV }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to distro
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          REV=$(cat VERSION)
          mkdir -p distro/rev-$REV
          cp app/build/outputs/apk/debug/*.apk distro/rev-$REV/NextcloudPhoneTrack-rev$REV-debug.apk
          cp SPEC.md distro/rev-$REV/SPEC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distro/rev-$REV/
          git diff --staged --quiet || git commit -m "ci: publish Rev $REV signed debug APK and SPEC to distro"
          git push
