name: Android CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Sync VERSION to assets
        run: |
          mkdir -p app/src/main/assets
          cp VERSION app/src/main/assets/VERSION

      - name: Decode keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Get revision
        id: rev
        run: echo "REV=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-rev${{ steps.rev.outputs.REV }}-run${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to distro and bump version
        run: |
          REV=$(cat VERSION)
          RUN=${{ github.run_number }}
          FOLDER=distro/rev-$REV-run-$RUN
          mkdir -p $FOLDER
          cp app/build/outputs/apk/debug/*.apk $FOLDER/NextcloudPhoneTrack-rev$REV-run$RUN-debug.apk
          cp SPEC.md $FOLDER/SPEC.md
          # Increment lowest segment of 0.x
          MAJOR=$(echo $REV | cut -d. -f1)
          MINOR=$(echo $REV | cut -d. -f2)
          NEXT=$((MINOR + 1))
          echo "$MAJOR.$NEXT" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FOLDER/ VERSION
          git diff --staged --quiet || git commit -m "ci: publish Rev $REV run $RUN and bump to $MAJOR.$NEXT"
          git push
